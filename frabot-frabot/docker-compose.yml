version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<compose-service>_1 is the name Umbrel gives this container.
      APP_HOST: frabot-frabot_web_1
      APP_PORT: 8080

  # I bind mount creati da Docker possono appartenere a root. Il bot gira
  # come UID 1000 e in una cartella di root non può creare il database:
  # questo container prepara i permessi e termina.
  prepara:
    image: alpine:3
    restart: "no"
    command:
      - sh
      - -c
      - "mkdir -p /data && chown -R 1000:1000 /data"
    volumes:
      - ${APP_DATA_DIR}/data:/data

  web:
    image: ghcr.io/OWNER/frabot:1.0.2
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # The image already runs as UID/GID 1000. Umbrel creates APP_DATA_DIR for
    # UID 1000, so the container can write SQLite and transcripts there.
    user: "1000:1000"
    environment:
      FRABOT_DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      - prepara
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
