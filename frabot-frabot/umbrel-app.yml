  Prima versione pubblica.


  Include configurazione guidata, modulo ticket con transcript, sette mini giochi
  con economia virtuale, annunci live Twitch e pannello di gestione completo in
  italiano. I segreti restano nel volume /data e non vengono mai restituiti dalle
